{%- elif n=='lock' %}<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif n=='user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
{%- elif n=='upload' %}<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
{%- elif n=='file' %}<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>
{%- elif n=='check' %}<path d="M5 12l5 5 9-10"/>
{%- elif n=='search' %}<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>

{%- elif n=='bookmark' %}<path d="M6 4h12v17l-6-4-6 4z"/>

{% macro mark(s=34, bg='#14213D', fg='#fff') -%}
<svg width="{{s}}" height="{{s}}" viewBox="0 0 32 32" role="img" aria-label="Veritext logo"><rect width="32" height="32" rx="8" fill="{{bg}}"/><path d="M9 11l7 11 7-11" fill="none" stroke="{{fg}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="8.5" r="2.6" fill="#B8501A"/></svg>
{%- endmacro %}
{% macro chip(v) -%}<span class="chip {{v}}">{{ {'ai':'AI-generated','hu':'Human-written','mix':'Mixed'}[v] }}</span>{%- endmacro %}
