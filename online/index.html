<style>

a{color:inherit;text-decoration:none}

.acts{display:flex;gap:12px;flex-wrap:wrap}

.stp{display:flex;gap:14px;margin-top:18px}.stp b{display:block;font-weight:500}.stp small{color:var(--muted);font-size:14px}
.num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font:500 13px 'IBM Plex Mono',monospace;flex:none}

.auth{display:flex;min-height:100vh}

.auth h1{font-size:32px;font-weight:600;letter-spacing:-.5px}
label.f{display:flex;flex-direction:column;gap:8px;font-weight:500;font-size:14px}
.in{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border:1px solid #BDBAAE;border-radius:10px;background:#fff;color:var(--muted)}

600582874377748, 0.005745273809861635, 0.0016686065941126722, 0.0, 0.07708721304909452]};
const FW=new Set("the a an and or but if of to in on at by for with from as is are was were be been it this that these those i you he she we they not no so than then there their his her its our your".split(/\s+/));
const TR=["moreover","furthermore","additionally","consequently","therefore","overall","however","thus","notably","importantly","ultimately","in conclusion","in summary"];
const FP=new Set(["i","me","my","mine","we","our"]);
function countSub(s,t){return s.split(t).length-1}
function splitSentences(text){const p=text.trim().split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);return p}
function extract(text){
  const low=text.toLowerCase();
  const words=low.match(/[A-Za-z']+/g)||[];
  const n=Math.max(words.length,1);
  let sents=splitSentences(text); if(!sents.length) sents=[text];
  const sl=sents.map(s=>(s.match(/[A-Za-z']+/g)||[]).length);
  const chars=Math.max([...text].length,1);
  const counts=new Map(); for(const w of words) counts.set(w,(counts.get(w)||0)+1);
  const bg=[]; for(let i=0;i+1<words.length;i++) bg.push(words[i]+"\u0000"+words[i+1]);
  const repBi=(bg.length-new Set(bg).size)/Math.max(bg.length,1);
  const mean=sl.reduce((a,b)=>a+b,0)/sl.length;
  const std=Math.sqrt(sl.reduce((a,b)=>a+(b-mean)*(b-mean),0)/sl.length);

    words.length,
    words.length? words.reduce((a,w)=>a+[...w].length,0)/words.length:0,

    words.filter(w=>FW.has(w)).length/n,
    TR.reduce((a,t)=>a+countSub(low,t),0)/n,
    contr/n,
    words.filter(w=>FP.has(w)).length/n,
    (countSub(text,"?")+countSub(text,"!"))/Math.max(sents.length,1),

const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'U';
function when(iso){const d=new Date(iso),days=Math.floor((new Date().setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/864e5);return days<=0?'Today':days===1?'Yesterday':days<7?days+' days ago':d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}
function analyze(text){
  const p=pAI(text),f=extract(text);
  const segs=splitSentences(text).map(s=>({text:s,ai:pAI(s)>=.5}));
  const feats=Object.keys(FL).map(k=>{const i=MODEL.features.indexOf(k),h=MODEL.hum_mean[i],a=MODEL.ai_mean[i];const pos=a===h?.5:Math.min(1,Math.max(0,(f[i]-h)/(a-h)));return{k,label:FL[k],value:f[i].toFixed(2),pos:Math.round(pos*100)}});
  const signals=[...feats].sort((x,y)=>Math.abs(y.pos-50)-Math.abs(x.pos-50)).slice(0,3).map(x=>{const m=(x.pos>=50?AIM:HUM)[x.k];return{ai:x.pos>=50,title:m[0],desc:m[1]}});
  return{p,segs,feats,signals,words:(text.match(/\S+/g)||[]).length};
}
const NAV=[['home','home','Dashboard'],['analyze','scan','New analysis'],['history','history','History'],['preferences','settings','Settings & About']];
const shell=(act,head,sub,acts,body)=>`<div class="app"><aside class="side"><div class="brand">${mark(34)}<div><b>Veritext</b><small>AI text detection</small></div></div><nav class="nav">${NAV.map(([r,i,l])=>`<a href="#${r}" class="${act===r?'on':''}">${ic(i)}${esc(l)}</a>`).join('')}</nav><div class="me"><div class="av">${esc(initials(S.user.name))}</div><div><div style="font-weight:500">${esc(S.user.name)}</div><div class="muted" style="font-size:13px">Student</div></div></div></aside><main class="main">${S.flash?`<div class="flash" role="alert">${esc(S.flash)}</div>`:''}<div class="head"><div><h1>${head}</h1><p>${sub}</p></div><div class="acts">${acts||''}</div></div>${body}</main></div>`;
const V={};
V.splash=()=>`<div class="splash">${mark(88,'#fff','#14213D')}<h1>Veritext</h1><p>Find out whether a text was written by a person or by AI.</p><div class="load"><div></div></div><small>Generative AI &amp; NLP project &middot; Athrav Singh</small></div>`;
V.signin=()=>`<div class="auth"><section class="l"><div class="brand">${mark(36,'#fff','#14213D')}<b style="font-size:22px">Veritext</b></div><div><h2>Human or AI? Get a clear answer in seconds.</h2>${[['Read the text','You paste or upload any essay or article.'],['Measure two things','Writing style, and deeper language patterns.'],['Combine and decide','Both results are fused into one verdict.']].map((x,i)=>`<div class="st"><div class="n">${i+1}</div><div><b>${x[0]}</b><small>${x[1]}</small></div></div>`).join('')}</div><small style="color:#A9B4CA">Stylometric and transformer-based feature fusion</small></section><section class="r"><form id="login"><div><h1>Sign in</h1><p class="muted" style="margin-top:6px">Welcome back. Enter your details to continue.</p></div><label class="f">Name<span class="in">${ic('file')}<input name="name" placeholder="Your name" value="Athrav Singh" required></span></label><label class="f">Email<span class="in">${ic('mail')}<input type="email" name="email" placeholder="name@college.edu" required></span></label><label class="f">Password<span class="in">${ic('lock')}<input type="password" name="pw" placeholder="Enter your password" required></span></label><button class="btn big" type="submit">Sign in ${ic('arrow',18)}</button><div class="demo">Demo sign-in: any email and password works. Your data stays in this browser only.</div></form></section></div>`;
V.home=()=>{const h=S.hist,ai=h.filter(r=>r.verdict==='ai').length,conf=h.length?Math.round(100*h.reduce((a,r)=>a+Math.max(r.p,1-r.p),0)/h.length):0;
 return shell('home',`Welcome back, ${esc(S.user.name.split(' ')[0])}`,'Check a text or open one of your recent results.',`<a class="btn" href="#analyze">${ic('plus',18)}New analysis</a>`,
 `<div class="grid2"><div class="card pad"><div class="ct">Check a text</div><div class="drop">Paste an essay, article or any passage to see if it reads as human or AI.</div><div class="acts" style="justify-content:space-between"><div class="acts"><a class="btn s" href="#analyze">Paste text</a><a class="btn s" href="#analyze">${ic('upload',18)}Upload file</a></div><a class="btn" href="#analyze">Analyze text ${ic('arrow',18)}</a></div></div><div class="card pad"><div class="ct" style="margin-bottom:4px">Your activity</div><div class="stat"><span class="muted">Texts checked</span><b>${h.length}</b></div><div class="stat"><span class="muted">Flagged as AI</span><b>${ai}</b></div><div class="stat"><span class="muted">Average confidence</span><b>${conf}%</b></div></div></div>
 <div class="card"><div class="row" style="min-height:62px"><span class="ct" style="flex:1">Recent checks</span><a href="#history" style="color:var(--humd);font-weight:500">View all</a></div>${h.slice(0,4).map(r=>`<a class="row" href="#result" data-open="${r.id}"><div class="c1">${ic('file',18)}<span>${esc(r.title)}</span></div><div class="c2">${r.source}</div><div class="c3">${chip(r.verdict)}</div><div class="c4" style="text-align:right">${when(r.created)}</div></a>`).join('')||'<div class="row muted" style="min-height:80px">No checks yet. Run your first analysis above.</div>'}</div>`)};
V.analyze=()=>shell('analyze','New analysis','Paste or upload the text you want to check.','',
 `<div class="grid2"><div class="card" style="display:flex;flex-direction:column"><div class="bar"><label class="btn s" style="height:40px;cursor:pointer">${ic('upload',18)}Upload .txt<input type="file" id="file" accept=".txt,text/plain" hidden></label><button type="button" class="btn s" style="height:40px" id="clear">${ic('trash',18)}Clear</button><button type="button" class="btn s" style="height:40px" id="sAI">Try AI sample</button><button type="button" class="btn s" style="height:40px" id="sHU">Try human sample</button></div><textarea class="big" id="text" aria-label="Text to analyze" placeholder="Paste your text here...">${esc(S.draft)}</textarea><div class="foot"><span>Plain text files supported</span><span class="mono" id="wc">0 words</span></div></div>
 <div class="stack"><div class="card pad stack12"><div class="ct" style="margin-bottom:2px">Detection mode</div><label class="mode"><input type="radio" name="mode" checked><span><b>Stylometric model</b><small>Your trained model, running in this page</small></span></label><div class="mode off"><span><b>Transformer / Fusion</b><small>Available in the Python app (needs DistilBERT + GPT-2)</small></span></div></div><div class="card pad" style="display:flex;justify-content:space-between"><b style="font-weight:500">Language</b><span class="muted">English</span></div><button class="btn big" id="go">${ic('scan',20)}Analyze text</button></div></div>`);
V.result=()=>{const r=S.cur;if(!r)return null;const a=analyze(r.text),p=Math.round(r.p*100);const col={ai:'var(--aid)',hu:'var(--humd)',mix:'var(--mixd)'}[r.verdict];
 return shell('analyze','Analysis result',`${esc(r.title)} &middot; ${a.words} words`,`<a class="btn s" href="#history">${ic('check',18)}Saved in history</a><a class="btn" href="#report">View full report ${ic('arrow',18)}</a>`,
 `<div class="card verdict"><div><div class="lab">Verdict</div><h2 style="color:${col}">${{ai:'Likely AI-generated',hu:'Likely human-written',mix:'Mixed signals'}[r.verdict]}</h2></div><div class="meter"><div class="t"><span style="color:var(--humd)">Human ${100-p}%</span><span style="color:var(--aid)">AI ${p}%</span></div><div class="b"><div style="width:${100-p}%;background:var(--hum)"></div><div style="width:${p}%;background:var(--ai)"></div></div><div class="muted" style="margin-top:10px;font-size:13px">Score from the stylometric model.</div></div></div>
 <div class="grid2"><div class="card"><div class="row" style="min-height:58px"><span class="ct" style="flex:1">Analyzed text</span><span class="legend"><span><i class="s-ai"></i>AI-like</span><span><i class="s-hu"></i>Human-like</span></span></div><div class="txt">${a.segs.map(s=>`<span class="${s.ai?'s-ai':'s-hu'}">${esc(s.text)}</span> `).join('')}</div></div>
 <div class="stack"><div class="card pad"><div class="ct">Model scores (AI probability)</div><div class="sc"><div class="l"><span>Stylometric</span><span class="mono">${p}%</span></div><div class="track"><div style="width:${p}%;background:var(--ai)"></div></div></div><div class="sc"><div class="l"><span class="muted">Transformer</span><span class="muted">Python app</span></div></div><div class="sc"><div class="l"><span class="muted">Fusion</span><span class="muted">Python app</span></div></div></div>
 <div class="card pad"><div class="ct">Main signals</div>${a.signals.map(s=>`<div class="sig"><i style="background:${s.ai?'var(--ai)':'var(--hum)'}"></i><div><b>${esc(s.title)}</b><small>${esc(s.desc)}</small></div></div>`).join('')}</div></div></div>`)};
V.report=()=>{const r=S.cur;if(!r)return null;const a=analyze(r.text),p=Math.round(r.p*100);const bg={ai:'var(--ait)',hu:'var(--humt)',mix:'var(--mix)'}[r.verdict],fg={ai:'var(--aid)',hu:'var(--humd)',mix:'var(--mixd)'}[r.verdict];
 return shell('analyze','Detailed report',`Why Veritext reached this verdict &middot; ${esc(r.title)}`,`<button class="btn s" id="copyrep">${ic('copy',18)}Copy summary</button><a class="btn" href="#home">${ic('check',18)}Done</a>`,
 `<div class="grid2" style="grid-template-columns:1.5fr 1fr"><div class="card pad"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="ct">Stylometric signals</span><span class="muted" style="font-size:13px">Human-like &larr; this text &rarr; AI-like</span></div><div style="margin-top:8px">${a.feats.map(f=>`<div class="feat"><div class="n">${f.label}</div><div class="v mono">${f.value}</div><div class="scale"><i style="left:${f.pos}%"></i></div></div>`).join('')}</div></div>
 <div class="stack"><div class="card pad stack12"><div class="ct">Transformer signals</div><div class="box"><b style="font-weight:500">DistilBERT + GPT-2</b><span class="mono muted" style="font-size:13px">Python app only</span></div></div><div class="card pad stack12"><div class="ct">Final result</div><div class="box"><b style="font-weight:500">Stylometric score</b><span class="mono">${p}%</span></div><div class="fin" style="background:${bg};color:${fg}"><span>Final: ${VL[r.verdict]}</span><span class="mono" style="font-size:20px">${p}% AI</span></div></div></div></div>`)};
V.history=()=>{const rows=S.hist.filter(r=>(!S.q||r.title.toLowerCase().includes(S.q.toLowerCase()))&&(S.f==='all'||r.verdict===S.f));
 return shell('history','History','Every text you have checked.','',`<div class="filters"><label class="search">${ic('search')}<input type="search" id="q" value="${esc(S.q)}" placeholder="Search your checks" aria-label="Search your checks"></label>${[['all','All'],['ai','AI-generated'],['hu','Human-written'],['mix','Mixed']].map(([k,l])=>`<button class="pill ${S.f===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
 <div class="card"><div class="row th"><div class="c1">TEXT</div><div class="c2">SOURCE</div><div class="c3">VERDICT</div><div class="c4">AI SCORE</div><div class="c4">DATE</div><div style="width:40px"></div></div>${rows.map(r=>`<div class="row"><a class="c1" href="#result" data-open="${r.id}">${ic('file',18)}<span>${esc(r.title)}</span></a><div class="c2">${r.source}</div><div class="c3">${chip(r.verdict)}</div><div class="c4 mono" style="color:var(--ink)">${Math.round(r.p*100)}%</div><div class="c4">${when(r.created)}</div><button class="x" data-del="${r.id}" aria-label="Delete ${esc(r.title)}">${ic('trash',18)}</button></div>`).join('')||'<div class="row muted" style="min-height:90px">Nothing here yet.</div>'}</div>`)};
V.preferences=()=>shell('preferences','Settings &amp; About','Preferences and project information.','',
 `<div class="grid2" style="grid-template-columns:1fr 1.15fr"><form id="prefs" class="card pad" style="display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line)"><div class="av" style="width:56px;height:56px;font-size:18px">${esc(initials(S.user.name))}</div><div><div style="font-size:18px;font-weight:600">${esc(S.user.name)}</div><div class="muted">Student</div></div></div><div class="set"><div><b style="font-weight:500">Display name</b><small>Shown in the menu</small></div><input name="name" value="${esc(S.user.name)}" aria-label="Display name" style="height:40px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;font:500 15px inherit;width:170px"></div><div class="set"><div><b style="font-weight:500">AI threshold (%)</b><small>Centre point between human and AI (30 to 70)</small></div><input type="number" name="thr" min="30" max="70" value="${S.user.thr||50}" aria-label="AI threshold" style="width:90px"></div><div style="display:flex;gap:12px;margin-top:24px"><button class="btn" type="submit">${ic('check',18)}Save settings</button><button type="button" class="btn s" id="out">${ic('logout',18)}Sign out</button></div></form>
 <div class="card pad"><div style="display:flex;align-items:center;gap:14px">${mark(44)}<div><div class="muted" style="font-size:12px;font-weight:500;letter-spacing:.6px">ABOUT THIS PROJECT</div><div style="font-size:19px;font-weight:600;line-height:1.25">AI-Generated Text Detection Using Stylometric and Transformer-Based Feature Fusion</div></div></div><div style="display:flex;gap:32px;font-size:14px;margin:20px 0;flex-wrap:wrap"><div><div class="muted">Domain</div><b style="font-weight:500">Generative AI &amp; NLP</b></div><div><div class="muted">Student</div><b style="font-weight:500">Athrav Singh</b></div><div><div class="muted">This page runs</div><b style="font-weight:500">Stylometric model</b></div></div><div style="height:1px;background:var(--line)"></div>${[['Stylometric features','Sentence length, vocabulary, punctuation and formal linking words.'],['Transformer features','DistilBERT embeddings and GPT-2 predictability (Python app).'],['Feature fusion','Both are combined and a classifier gives Human or AI (Python app).']].map((x,i)=>`<div class="stp"><div class="num">${i+1}</div><div><b>${x[0]}</b><small>${x[1]}</small></div></div>`).join('')}</div></div>`);
let splashTimer=null;
function route(){
  clearTimeout(splashTimer);
  let r=(location.hash||'').slice(1)||'splash';
  if(r==='splash'){$app.innerHTML=V.splash();splashTimer=setTimeout(()=>{location.hash=S.user?'home':'sign-in'},2300);return}
  if(r==='sign-in'){if(S.user){location.hash='home';return}$app.innerHTML=V.signin();return}
  if(!S.user){location.hash='sign-in';return}
  if(!V[r]){location.hash='home';return}
  const html=V[r]();if(html===null){location.hash='home';return}
  $app.innerHTML=html;S.flash='';window.scrollTo(0,0);bind(r);
}
function bind(r){
  if(r==='analyze'){const t=document.getElementById('text'),wc=document.getElementById('wc');const c=()=>{S.draft=t.value;wc.textContent=((t.value.trim().match(/\S+/g)||[]).length)+' words'};t.addEventListener('input',c);c();
   document.getElementById('clear').onclick=()=>{t.value='';c()};document.getElementById('sAI').onclick=()=>{t.value=SAMPLE_AI;c()};document.getElementById('sHU').onclick=()=>{t.value=SAMPLE_HU;c()};
   let up=null;document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{t.value=String(rd.result);up=f.name;t.dataset.name=f.name;c()};rd.readAsText(f)};
   document.getElementById('go').onclick=()=>{const text=t.value.trim();if((text.match(/\S+/g)||[]).length<8){S.flash='Please enter at least 8 words so the result is meaningful.';route();return}
    const p=pAI(text),src=t.dataset.name?'Uploaded':'Pasted',title=t.dataset.name||text.split(/\s+/).slice(0,5).join(' ')+'...';
    const rec={id:Date.now(),title,source:src,text,p,verdict:verdict(p,thr()),created:new Date().toISOString()};S.hist.unshift(rec);lsSet('vt_hist',S.hist);S.cur=rec;S.draft='';location.hash='result'}}
  if(r==='history'){document.getElementById('q').oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;route();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)};
   document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.f=b.dataset.f;route()});
   document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.hist=S.hist.filter(x=>x.id!=b.dataset.del);lsSet('vt_hist',S.hist);route()})}
  if(r==='report'){document.getElementById('copyrep').onclick=()=>{const x=S.cur,a=analyze(x.text);const txt=`Veritext report\n${x.title}\nVerdict: ${VL[x.verdict]} (${Math.round(x.p*100)}% AI)\n`+a.feats.map(f=>`${f.label}: ${f.value}`).join('\n');try{navigator.clipboard.writeText(txt).then(()=>{S.flash='Summary copied.';route()}).catch(()=>{})}catch(e){}}}
  if(r==='preferences'){document.getElementById('prefs').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);S.user.name=(f.get('name')||'').trim()||S.user.name;S.user.thr=Math.min(70,Math.max(30,parseInt(f.get('thr'))||50));lsSet('vt_user',S.user);S.flash='Settings saved.';route()};
   document.getElementById('out').onclick=()=>{S.user=null;lsSet('vt_user',null);location.hash='sign-in'}}
  document.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click',()=>{S.cur=S.hist.find(x=>x.id==a.dataset.open)}));
}
document.addEventListener('submit',e=>{if(e.target.id==='login'){e.preventDefault();const f=new FormData(e.target);S.user={name:(f.get('name')||'').trim()||'Athrav Singh',thr:50};lsSet('vt_user',S.user);location.hash='home'}});
window.addEventListener('hashchange',route);route();

</script></body></html>
